<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Limitr page-script bench</title>
  <script>
    // An AudioContext that takes 600 ms to start, longer than content-audio.js waits for resume().
    // Nothing else (no second click) happens afterwards.
    const NativeAudioContext = window.AudioContext;
    window.AudioContext = class SlowStartAudioContext extends NativeAudioContext {
      constructor(options) {
        super(options);
        this.startedAt = 0;
      }
      get state() {
        return this.startedAt && performance.now() >= this.startedAt ? super.state : 'suspended';
      }
      resume() {
        if (!this.startedAt) {
          this.startedAt = performance.now() + 600;
          setTimeout(() => this.dispatchEvent(new Event('statechange')), 610);
        }
        return new Promise(resolve => setTimeout(resolve, 610)).then(() => super.resume());
      }
    };

    // Collect what content-audio.js reports to its bridge
    window.pageStatus = null;
    window.addEventListener('message', (event) => {
      if (event.data && event.data.source === 'limitr-page' && event.data.type === 'status') {
        window.pageStatus = event.data.status;
      }
    });
  </script>
  <script src="../lib/settings.js"></script>
  <script src="../lib/engine.js"></script>
  <script src="../content-audio.js"></script>
</head>
<body>
  <button id="play">Play</button>
  <audio id="player" loop></audio>
  <script>
    // Same-origin audio: a 2 s 440 Hz tone as a blob URL
    (function () {
      const rate = 48000;
      const samples = rate * 2;
      const view = new DataView(new ArrayBuffer(44 + samples * 2));
      const text = (offset, s) => [...s].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
      text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVEfmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true);
      view.setUint16(34, 16, true); text(36, 'data'); view.setUint32(40, samples * 2, true);
      for (let i = 0; i < samples; i++) view.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / rate) * 8000, true);
      document.getElementById('player').src = URL.createObjectURL(new Blob([view.buffer], { type: 'audio/wav' }));
    })();

    // Stand in for content-bridge.js: send the page script its config
    window.postMessage({
      source: 'limitr-bridge',
      type: 'config',
      settings: LimitrSettings.applyPreset({ volume: 0 }, 'stream'),
      enabled: true,
      captured: false,
      captions: false,
      extensionBase: new URL('../', location.href).href
    }, '*');

    document.getElementById('play').addEventListener('click', () => document.getElementById('player').play());
    window.benchReady = true;
  </script>
</body>
</html>
