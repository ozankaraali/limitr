<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Limitr</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="popup" id="popup">
    <section class="screen" data-screen="main">
      <header class="masthead">
        <svg class="mark" viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
          <path fill="currentColor" d="M14.00,50.00 L14.75,47.97 L15.50,45.95 L16.25,43.95 L17.00,41.98 L17.75,40.04 L18.50,38.14 L19.25,36.29 L20.00,34.50 L20.75,32.78 L21.50,31.13 L22.25,29.56 L23.00,28.08 L23.75,26.69 L24.50,25.41 L25.25,24.22 L26.00,23.15 L26.75,22.20 L27.50,21.36 L28.25,20.65 L29.00,20.06 L29.75,19.60 L30.50,19.27 L31.25,19.07 L32.00,19.00 L32.75,19.07 L33.50,19.27 L34.25,19.60 L35.00,20.06 L35.75,20.65 L36.50,21.36 L37.25,22.20 L38.00,23.15 L38.75,24.22 L39.50,25.41 L40.25,26.69 L41.00,28.08 L41.75,29.56 L42.50,31.13 L43.25,32.78 L44.00,34.50 L44.75,36.29 L45.50,38.14 L46.25,40.04 L47.00,41.98 L47.75,43.95 L48.50,45.95 L49.25,47.97 L50.00,50.00 Z M50.00,50.00 L50.75,52.03 L51.50,54.05 L52.25,56.05 L53.00,58.02 L53.75,59.96 L54.50,61.86 L55.25,63.71 L56.00,65.50 L56.75,67.22 L57.50,68.87 L58.25,70.44 L59.00,71.92 L59.75,73.31 L60.50,74.59 L61.25,75.78 L62.00,76.85 L62.75,77.80 L63.50,78.64 L64.25,79.35 L65.00,79.94 L65.75,80.40 L66.50,80.73 L67.25,80.93 L68.00,81.00 L68.75,80.93 L69.50,80.73 L70.25,80.40 L71.00,79.94 L71.75,79.35 L72.50,78.64 L73.25,77.80 L74.00,76.85 L74.75,75.78 L75.50,74.59 L76.25,73.31 L77.00,71.92 L77.75,70.44 L78.50,68.87 L79.25,67.22 L80.00,65.50 L80.75,63.71 L81.50,61.86 L82.25,59.96 L83.00,58.02 L83.75,56.05 L84.50,54.05 L85.25,52.03 L86.00,50.00 Z"/>
          <rect fill="currentColor" x="9" y="48.2" width="82" height="3.6" rx="1.8"/>
        </svg>
        <h1 class="wordmark">Limitr</h1>
        <label class="power" title="Turn Limitr on or off everywhere">
          <input type="checkbox" id="power" role="switch">
          <span class="power-track"><span class="power-thumb"></span></span>
          <span class="power-label" id="powerLabel">Off</span>
        </label>
      </header>

      <p class="status" id="status" aria-live="polite"></p>

      <div class="trace" role="img" aria-label="Loudness over the last few seconds">
        <canvas id="trace" width="656" height="144"></canvas>
      </div>
      <p class="caught" id="traceCaption"></p>

      <div class="preset-grid" id="presetGrid" role="radiogroup" aria-label="Presets"></div>
      <div class="chip-row" id="presetChips" aria-label="Your presets" hidden></div>
      <p class="preset-explainer" id="presetExplainer"></p>

      <div class="volume-row">
        <label for="volume">Volume</label>
        <input type="range" id="volume">
        <output id="volumeValue" for="volume"></output>
      </div>

      <ul class="quick-toggles">
        <li>
          <label class="toggle-row">
            <span class="toggle-text">
              <span>Remove background noise</span>
              <small id="denoiseNote">Fans, keyboards, hiss</small>
            </span>
            <input type="checkbox" id="denoiseEnabled" role="switch">
            <span class="switch" aria-hidden="true"></span>
          </label>
        </li>
        <li class="captions-row">
          <!-- for= ties the row to the switch; without it the label would act on the chip button -->
          <label class="toggle-row" for="captions">
            <span class="toggle-text">
              <span>Live captions</span>
              <small id="captionsNote">Runs on your computer. The first time downloads a speech model.</small>
            </span>
            <button type="button" class="chip-button" id="captionsChip" hidden></button>
            <input type="checkbox" id="captions" role="switch">
            <span class="switch" aria-hidden="true"></span>
          </label>
        </li>
      </ul>

      <nav class="nav-rows" aria-label="More settings">
        <button type="button" class="nav-row" data-open="finetune">Fine-tune</button>
        <button type="button" class="nav-row" data-open="listening">How Limitr listens</button>
      </nav>
    </section>

    <section class="screen" data-screen="captions" hidden>
      <header class="screen-head">
        <button type="button" class="back" aria-label="Back to Limitr">&larr;</button>
        <h2>Live captions</h2>
      </header>
      <div class="screen-body">
        <label class="select-row">
          <span>Language</span>
          <select id="captionsLanguage"></select>
        </label>
        <label class="select-row">
          <span>Translate to</span>
          <select id="captionsTranslate"></select>
        </label>
        <label class="toggle-row" hidden>
          <span class="toggle-text">
            <span>Larger model for other languages</span>
            <small>More accurate. A 410 MB download that runs on the graphics card.</small>
          </span>
          <input type="checkbox" id="captionsLargeModel" role="switch">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <p class="group-note" id="captionsHint" hidden></p>
        <button type="button" class="button quiet" id="translationDownload" hidden></button>
        <ol class="transcript" id="transcript" aria-live="polite" hidden></ol>
        <button type="button" class="button quiet" id="saveTranscript" hidden>Save transcript</button>
      </div>
    </section>

    <section class="screen" data-screen="finetune" hidden>
      <header class="screen-head">
        <button type="button" class="back" aria-label="Back to Limitr">&larr;</button>
        <h2>Fine-tune</h2>
      </header>
      <div class="live-strip">
        <canvas id="miniTrace" width="656" height="80"></canvas>
        <p class="caught mini" id="miniCaught"></p>
        <p class="mini-preset" id="miniPreset"></p>
      </div>
      <div class="screen-body">
        <div id="fineTuneBody"></div>
        <section class="saved-presets" id="savedPresets" tabindex="-1" aria-label="Your presets">
          <h3>Your presets</h3>
          <ul id="savedPresetList"></ul>
          <form id="savePresetForm" hidden>
            <input type="text" id="presetName" maxlength="24" placeholder="Name this preset" required>
            <button type="submit" class="button">Save</button>
            <button type="button" class="button quiet" id="cancelPreset">Cancel</button>
          </form>
          <button type="button" class="button quiet" id="savePresetButton">Save these settings as a preset</button>
        </section>
      </div>
    </section>

    <section class="screen" data-screen="listening" hidden>
      <header class="screen-head">
        <button type="button" class="back" aria-label="Back to Limitr">&larr;</button>
        <h2>How Limitr listens</h2>
      </header>
      <div class="screen-body">
        <div class="mode-choice" role="radiogroup" aria-label="How Limitr listens">
          <label class="mode-option">
            <input type="radio" name="mode" value="page">
            <span class="mode-title">Inside the page</span>
            <small>Works in every browser and in fullscreen. Some protected players can't be reached.</small>
          </label>
          <label class="mode-option" id="captureOption">
            <input type="radio" name="mode" value="capture">
            <span class="mode-title">Whole tab</span>
            <small id="captureNote">Catches every sound, including protected video. Starts on a tab when you open Limitr there. Fullscreen stays inside the window.</small>
          </label>
        </div>
        <div class="mixer" id="mixer" hidden>
          <h3 class="mixer-title">Tabs Limitr is listening to</h3>
          <ul id="mixerList"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
